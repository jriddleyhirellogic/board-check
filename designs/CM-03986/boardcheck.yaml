# Board check configuration for CM-03986 backplane (Q8J, SV1) flight model.
# Values here override boardcheck/config.py DEFAULTS; see that file for
# every option.

export:
  min_version: "2.4.0"
  # Title and hierarchy sheets: no components by design.
  empty_sheets_ok:
    - CM-03984.SchDoc
    - SV1 BACKPLANE TOP LEVEL.SchDoc

# M1..M29 are mounting holes; RT1 is a thermistor.
designator_kinds:
  M: mechanical
  RT: thermistor

nets:
  ground: [GND, CHASSIS, SRS4_GND, TOA_GND, AGND, DGND, PGND]
  # Replaces the default list, so the default pattern is repeated. The
  # HDRM_CTRL_BP_TO_MPS_P1..P4 / S1..S4 hold-down release controls are
  # single-ended Q8J GPIOs to J12, numbered P (primary) and S (secondary),
  # not differential pairs.
  diff_pair_ignore:
    - '_(RST|RESET|INT|INTERRUPT|IRQ|ALERT|FAULT|EN|CS|OE|WE|WP|HOLD)_N$'
    - 'HDRM_CTRL_.*_[PS]\d$'

derating:
  capacitor_voltage: {ceramic: 0.60, tantalum: 0.50, default: 0.60}
  resistor_power: 0.50

waivers: []
