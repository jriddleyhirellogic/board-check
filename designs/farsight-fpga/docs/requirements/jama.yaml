# Jama requirements that fall on the PolarFire FPGA. Generated by
# `python -m fsverif.jama --csv <export>`; edit `note:` and `verified_in:`
# by hand, not the text.
#
# Every FAR-CDH_FPGA L3 requirement, every other Jama requirement a PF FPGA
# requirement cites as its parent, and any listed with a `note:` saying why
# it is here with nothing under it. `verified_in:` names where one is
# verified outside this repository, such as the firmware's.
source: Jama trace view "Farsight", CSV export Farsight.csv (farsight-verification/docs/requirements)
requirements:
  - id: FAR-CDH_FPGA_L3REQ-1
    name: C&DH FPGA Softcore
    text: >
      The C&DH FPGA shall have a softcore to process and respond to commands
  - id: FAR-CDH_FPGA_L3REQ-2
    name: Image Format
    text: >
      The FARSIGHT system shall provide imagery and corresponding metadata in
      a format configured by the user
  - id: FAR-CDH_FPGA_L3REQ-3
    name: Image Identifiers
    text: >
      The FARSIGHT system shall provide imagery with unique identifiers for
      individual frames
  - id: FAR-CDH_FPGA_L3REQ-4
    name: Support Firmware Updates
    text: >
      The PolarFire FPGA shall support in-orbit updates of software and
      firmware to implement changes to core imager functionality
  - id: FAR-CDH_FPGA_L3REQ-11
    name: 'Request Images from FPGA: Non Buffered'
    text: >
      FARSIGHT Avionics shall transfer images directly from the IMX531 sensor
      when the frame buffer is disabled
  - id: FAR-CDH_FPGA_L3REQ-12
    name: 'Request Images from FPGA: Buffered'
    text: >
      FARSIGHT Avionics shall transfer images from the frame buffer when
      requested by the user
  - id: FAR-CDH_FPGA_L3REQ-13
    name: MGMT of Image and Telemetry
    text: >
      FARSIGHT Avionics shall manage storage of imagery data and
      time-correlated telemetry
  - id: FAR-CDH_FPGA_L3REQ-14
    name: Exposure Time Knowledge
    text: >
      FARSIGHT Avionics shall have knowledge of exposure start and stop to an
      accuracy of100 ns
    note: >
      Dispositioned DEFECT in the corrected baseline: malformed ('an accuracy
      of100 ns', and a value with no unit), finding AV-F-05. Conventions
      parent rule 3 forbids tracing to it, so no requirement does. Its intent
      is partly carried by PF-META-03 (exposure duration at microsecond
      resolution) and PF-META-10 (end of exposure detected within 100 ns); if
      it is repaired rather than withdrawn, they are its children.
  - id: FAR-CDH_FPGA_L3REQ-15
    name: Sensor Register Configuration
    text: >
      FARSIGHT Avionics shall set the FPA registers that configure imaging
      operations
    verified_in: farsight-avionics-sw docs/requirements/pf-firmware-requirements.md
    note: >
      Allocated to the PolarFire firmware: the softcore writes the FPA
      registers; the FPGA design only carries the writes. Traced there by
      PFW-CAM-18, PFW-CAM-19, PFW-CAM-21, PFW-CAM-23 and PFW-CAM-24.
  - id: FAR-CDH_FPGA_L3REQ-17
    name: Exposure Time Control Accuracy
    text: >
      FARSIGHT Avionics shall start (and stop) image exposure within ≤ 100 ns
      of trigger detection
  - id: FAR-CDH_FPGA_L3REQ-18
    name: Exposure Stop Control
    text: >
      FARSIGHT Avionics shall detect exposure stop within ≤ 100 ns
  - id: FAR-CDH_FPGA_L3REQ-19
    name: Exposure Start Control
    text: >
      FARSIGHT Avionics shall control exposure start within ≤ 100 ns
  - id: FAR-CDH_FPGA_L3REQ-20
    name: Ethernet Data Transfer
    text: >
      C&DH Firmware shall support image transfer over ethernet
  - id: FAR-CDH_FPGA_L3REQ-21
    name: PolarFire Firmware Version
    text: >
      FARSIGHT Avionics shall provide the user a unique version string for
      C&DH firmware.
  - id: FAR-CDH_FPGA_L3REQ-22
    name: (TBR) Frame Buffer Bad Region Detection
    text: >
      C&DH firmware shouldbe able to detect failing regions of the frame
      buffer Note: Waived requirement for SV1, possibly for SV2/3
    note: >
      Dispositioned DEFECT in the corrected baseline: 'shouldbe' is a typo,
      'should' is not a requirement verb, and a disposition ('Waived
      requirement for SV1, possibly for SV2/3', quoted as written) is embedded
      in the statement; it is also open in the TBR register. Conventions
      parent rule 3 forbids tracing to it, so no requirement does until it is
      reworded. Detecting failing frame-buffer regions would be C&DH
      firmware's, over the DDR4 the FPGA provides.
  - id: FAR-CDH_FPGA_L3REQ-23
    name: Focus Mechanism Actuation
    text: >
      C&DH Firmware shall manage actuation of Farsight's focus mechanism
  - id: FAR-CDH_FPGA_L3REQ-24
    name: Management of Imaging Sequences
    text: >
      C&DH Firmware shall control frame acquisition based on sequence
      parameters provided by the softcore
    verified_in: farsight-avionics-sw docs/requirements/pf-firmware-requirements.md
    note: >
      Allocated to the PolarFire firmware, as its wording says: the softcore
      sequences frame acquisition. Traced there by PFW-CAM-29, PFW-CAM-39,
      PFW-ERR-02 and PFW-ERR-03.
  - id: FAR-CDH_FPGA_L3REQ-25
    name: Firmware Direct Transfer of Imagery Data
    text: >
      C&DH Firmware shall provide direct transfer of imagery data from the
      sensor to a payload controller as fast as the highest speed data
      transfer interface to the bus
  - id: FAR-CDH_FPGA_L3REQ-26
    name: Firmware Manage Data Transfer
    text: >
      C&DH Firmware shall manage data transfer from frame buffers to a payload
      controller
    verified_in: farsight-avionics-sw docs/requirements/pf-firmware-requirements.md
    note: >
      Allocated to the PolarFire firmware, as its wording says: the softcore
      manages transfers out of the frame buffers. Traced there by PFW-DMA-04
      and PFW-INIT-18.
  - id: FAR-CDH_FPGA_L3REQ-27
    name: Manage Readout IMX531 Sensor
    text: >
      C&DH firmware shall manage readout from the FPA sensor
  - id: FAR-AB_L2REQ-6
    name: FARSIGHT Version Identification
    text: >
      FARSIGHT Avionics shall provide version information to the user upon
      request
  - id: FAR-AB_L2REQ-7
    name: Focal Plane Array Interfacing
    text: >
      FARSIGHT Avionics shall interface with and manage operation of the
      IMX531 focal plane array
  - id: FAR-EDT_L3REQ-2
    name: Ethernet Interface
    text: >
      FARSIGHT Avionics shall have an ethernet interface for image transfer
  - id: FAR-EDT_L3REQ-3
    name: TMTC Over Ethernet
    text: >
      The TMTC system shall support command ingestion and telemetry transfer
      over each of ethernet interfaces connected to the PolarFire
  - id: FAR-EDT_L3REQ-13
    name: Redundant Ethernet
    text: >
      FARSIGHT Avionics shall have redundant ethernet interfaces
  - id: FAR-FB_L3REQ-1
    name: Transfer Speed - Write
    text: >
      The Frame buffer shall have a write speed at least as fast as frames are
      transferred from the FPA
  - id: FAR-FB_L3REQ-2
    name: Number of Frames
    text: >
      The Frame Buffer shall be able to store ≥ 500 frames at a 12-bit depth
      unpacked
  - id: FAR-FB_L3REQ-3
    name: Frame Buffer Error-Correcting Code
    text: >
      The Frame Buffer shall have sufficient bus width for ECC
  - id: FAR-FB_L3REQ-4
    name: Transfer Speed - Read
    text: >
      The Frame Buffer shall have a read speed at least as fast as the highest
      speed data transfer interface to the bus
  - id: FAR-FPA_L5REQ-2
    name: Sensor Exposure Manual Triggering
    text: >
      The Sensor Assembly shall accept manual triggering of exposure start and
      stop.
  - id: FAR-FPA_L5REQ-5
    name: Max Frame Rate
    text: >
      The FARSIGHT system shall have maximum frame rate of at least 70 FPS at
      maximum bit depth, sustainable for at least 5 seconds (TBR)
  - id: FAR-GPOI_TMTC_L3REQ-3
    name: Interrupt Pin
    text: >
      FARSIGHT Avionics interface shall provide the bus with an output pin
      that users can configure for notification of specific events
  - id: FAR-L1REQ-19
    name: Fault Detection
    text: >
      The FARSIGHT system shall detect internal faults
  - id: FAR-L1REQ-20
    name: Internal Temperature Monitoring
    text: >
      The FARSIGHT system shall monitor internal component temperatures and
      take action if limits are exceeded
  - id: FAR-L1REQ-21
    name: Fault Reporting
    text: >
      The FARSIGHT system shall report detected faults to the user within
      system health and status information
  - id: FAR-L1REQ-22
    name: Transfer of Imagery
    text: >
      The FARSIGHT system shall provide captured imagery to the bus upon
      request
  - id: FAR-L1REQ-27
    name: Parameters - Image Sequence
    text: >
      The FARSIGHT system shall provide the user the ability to control
      collection of multiple images
  - id: FAR-L1REQ-28
    name: Trigger Method
    text: >
      The FARSIGHT system shall provide the user with the ability to configure
      the method of triggering imaging operations
  - id: FAR-L1REQ-30
    name: Number of Images
    text: >
      The FARSIGHT system shall provide the user the ability to limit an
      imaging sequence to a finite number of images
  - id: FAR-L1REQ-31
    name: Exposure Control
    text: >
      The FARSIGHT system shall provide the user with the ability to control
      exposure time prior to initiation of imaging sequences
  - id: FAR-SA_L3REQ-1
    name: Sensor Readout Information
    text: >
      The Sensor Assembly shall inform when readout is available.
  - id: FAR-SERDES_L3REQ-3
    name: PCIe TX Only
    text: >
      FARSIGHT Avionics' PCIe interface shall not be bi-directional and only
      transfer data from FARSIGHT Avionics to the bus
  - id: FAR-SERDES_L3REQ-4
    name: PCIe Transfer Speed
    text: >
      FARSIGHT Avionics PCIe interface shall operate at speeds ≥ 5 Gbps/lane
  - id: FAR-TMTC_SW_L4REQ-3
    name: Frame Buffer Read
    text: >
      The TMTC system shall transfer addressed memory sections from the frame
      buffer upon request
  - id: FAR-TMTC_SW_L4REQ-10
    name: Imaging Trigger - GPIO
    text: >
      The TMTC system shall support triggering of imaging operations via GPIO
  - id: FAR-TMTC_SW_L4REQ-16
    name: Imaging Trigger - Command Based
    text: >
      The TMTC system shall support triggering of imaging operations via a
      start command
  - id: FAR-TMTC_SW_L4REQ-24
    name: Negative Acknowledgement
    text: >
      The TMTC system shall respond to commands that have invalid fields with
      a negative acknowledgement as defined by the error enumeration list in
      FARSIGHT's SW ICD (CM-01979)
  - id: FAR-TMTC_SW_L4REQ-49
    name: Metadata Telemetry
    text: >
      The TMTC system shall record telemetry to correlate with image captures
