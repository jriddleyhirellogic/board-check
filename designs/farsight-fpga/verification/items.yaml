      For each latched timeout fault and camera-power fault stimulus, the
      detector asserts the common fault report output. A latched source fault
      with no common report fails.
    requires:      [VENV-02]
    evidence:      [JUnit result, coverage contribution]

  - id:            VC-PF-0024
    verifies:      [PF-FDIR-06]
    authorised_by: VVP-PF-006
    method:        HW
    level:         bench
    artifact:      test/hw/fdir_bench.md::HW-PF-FDIR-06
    criteria: >
      On a powered board, each induced timeout or camera-power fault appears in
      the common firmware-visible fault report.
    evidence:      [a hardware test record]

