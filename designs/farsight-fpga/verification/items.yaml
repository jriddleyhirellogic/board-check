    execution:     auto
    expect:        FAIL
    # The PolarFire's lvds_pwr_en and the housekeeper's fw_version[1] drive the
    # same line (PF-F-48), and pa3_fw_version[2:0] reads the housekeeper's DDR
    # failure lines (PF-F-49).

  # -------------------------------------------------------------------------
  # FDIR -- Camera fault response

  - id:            VC-PF-0019
    verifies:      [PF-FDIR-04]
    authorised_by: VVP-PF-001
    method:        SIM
    level:         unit
    artifact:      verification/tests/test_pf_fdir.py::test_PF_FDIR_04_timeout_fault_latches
    criteria: >
      With capture active and no frame-valid response before the configured
      timeout expires, the camera fault detector latches the timeout fault and
      keeps it visible at its status output.
    requires:      [VENV-02]
    evidence:      [JUnit result, coverage contribution]

  - id:            VC-PF-0020
    verifies:      [PF-FDIR-04]
    authorised_by: VVP-PF-006
    method:        HW
    level:         bench
    artifact:      test/hw/fdir_bench.md::HW-PF-FDIR-04
    criteria: >
      On a powered board, commanding capture while withholding frame-valid until
      past the configured timeout produces a firmware-visible timeout fault.
    evidence:      [a hardware test record]

  - id:            VC-PF-0021
    verifies:      [PF-FDIR-05]
    authorised_by: VVP-PF-001
    method:        SIM
    level:         unit
    artifact:      verification/tests/test_pf_fdir.py::test_PF_FDIR_05_power_fault_latches
    criteria: >
      With capture active and camera power status low, the camera fault detector
      latches the power-fault indication and keeps it visible at its status
      output, and the firmware-visible registers after a power fault differ from
      those after a timeout fault, so firmware can tell the two apart.
    requires:      [VENV-02]
    evidence:      [JUnit result, coverage contribution]
    expect:        FAIL
    # Tested to the rationale ("a distinct indication"): the power fault reaches
    # firmware only through the FAULT bit it shares with the timeout. PF-F-24.

  - id:            VC-PF-0022
    verifies:      [PF-FDIR-05]
    authorised_by: VVP-PF-006
    method:        HW
    level:         integration
    artifact:      test/hw/fdir_bench.md::HW-PF-FDIR-05
    criteria: >
      With the camera rail reported low while capture is active, the integrated
      board records a firmware-visible camera-power fault rather than a timeout
      or no fault.
    evidence:      [a hardware test record]
    expect:        FAIL
    # Camera power status crosses the housekeeper/PolarFire boundary, so the
    # hardware item spans more than one design.

  - id:            VC-PF-0023
    verifies:      [PF-FDIR-06]
    authorised_by: VVP-PF-001
    method:        SIM
    level:         unit
    artifact:      verification/tests/test_pf_fdir.py::test_PF_FDIR_06_any_latched_fault_reports
