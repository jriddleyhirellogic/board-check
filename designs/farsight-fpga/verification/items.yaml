      section 17.4 host-visible metadata format. A field order, width or name
      mismatch fails.
    evidence:      [JUnit result, the artefact inspected]
    execution:     auto
    expect:        FAIL
    # Checked against section 23.2, the metadata layout. Order and widths match;
    # the field at 0x40 is VERSION in the RTL and both firmware headers, and
    # PF_FPGA_VERSION in the ICD. PF-F-52.

