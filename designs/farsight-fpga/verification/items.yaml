# Verification items for the PolarFire FPGA.
#
# An item binds one requirement to a specific piece of evidence and cites the
# plan clause that authorises the method. Schema: framework I.6.
# Clauses: farsight-verification/docs/plans/pf-fpga-vv-plan.md.
#
# ---------------------------------------------------------------------------
# NO POLARFIRE VERIFICATION TESTS EXIST YET.
#
# Every `artifact` below names a test, inspection, analysis or hardware record
# that still has to be written. That is the intended order: the item states
# what would constitute a pass, so the eventual test is written to this
# criterion rather than the criterion being inferred from the test.
#
# A SIM item's provisional `test/sim/...` artifact moves to
# `verification/tests/test_pf_<area>.py::<same test name>` when its test is
# implemented. The test name is stable because it starts with the requirement
# identifier in method clause VVP-PF-001 form.
#
# ---------------------------------------------------------------------------
# Identifiers are flat and opaque, allocated in creation order, and never embed
# a requirement identifier. They are evidence identifiers, not requirement
# names, and are not renumbered when a requirement changes.

items:

  # -------------------------------------------------------------------------
  # BUILD -- Device/platform constraints

  - id:            VC-PF-0001
    verifies:      [PF-BUILD-06]
    authorised_by: VVP-PF-003
    method:        INSP
    level:         subsystem
    artifact:      verification/analysis/test_insp_build.py::test_PF_BUILD_06_targets_mpf500t
    criteria: >
      The build configuration selects the MPF500TS-FC1152M PolarFire device and
      package for the flight FPGA implementation. Any other target device or
      package fails.
    evidence:      [JUnit result, the artefact inspected]
    execution:     auto

  - id:            VC-PF-0002
    verifies:      [DRV-PF-10]
    authorised_by: VVP-PF-004
    method:        ANA
    level:         subsystem
    artifact:      verification/analysis/test_ana_build.py::test_DRV_PF_10_margin_and_slack
    criteria: >
      The retained Libero utilisation and timing reports show at least 20%
      unused fabric logic resources, at least 20% unused memory resources, and
      non-negative worst-case slack on every clock domain.
    requires:      [BUILD-01]
    evidence:      [the retained tool report]
    # Passes on the retained build: 69.5% of 4LUTs free, 79.3% of LSRAM, and no
    # negative slack at the part's three corners. Cross-domain paths are not
    # timed (DRV-PF-03), and the range is DRV-PF-05's.
    # Tool-computed utilisation and static timing make this VVP-PF-004 rather
    # than a hand budget.

  - id:            VC-PF-0126
    verifies:      [PF-BUILD-23]
    authorised_by: VVP-PF-003
    method:        INSP
    level:         subsystem
    artifact:      verification/analysis/test_insp_build.py::test_PF_BUILD_23_system_controller_available
    criteria: >
      The project configuration and the retained build both leave the PolarFire
      system controller unsuspended (SYSTEM_CONTROLLER_SUSPEND_MODE 0). A build
      that suspends it, or that does not record the setting, fails.
    evidence:      [JUnit result, the artefact inspected]
    execution:     auto

  # -------------------------------------------------------------------------
  # CLK -- External clocking and domain crossing

  - id:            VC-PF-0003
    verifies:      [PF-CLK-02]
    authorised_by: VVP-PF-004
    method:        ANA
    level:         subsystem
    artifact:      verification/analysis/test_ana_build.py::test_PF_CLK_02_50mhz_control_clock
    criteria: >
      The retained timing report declares the board 50 MHz input clock and
      propagates it as the primary control-plane clock for APB, PPS and focus
      timing domains.
    requires:      [BUILD-01]
    evidence:      [the retained tool report]

  - id:            VC-PF-0004
    verifies:      [PF-CLK-02]
    authorised_by: VVP-PF-006
    method:        HW
    level:         bench
    artifact:      test/hw/clk_bench.md::HW-PF-CLK-02
    criteria: >
      On a powered board, the FPGA accepts the board 50 MHz reference and the
      firmware-visible control plane operates from that clock without requiring
      any alternate primary clock source.
    evidence:      [a hardware test record]

  - id:            VC-PF-0005
    verifies:      [DRV-PF-02]
    authorised_by: VVP-PF-007
    method:        ANA
    level:         subsystem
    artifact:      verification/analysis/test_ana_build.py::test_DRV_PF_02_crossing_means_appropriate
    criteria: >
      Every crossing in the reviewed CDC list is classified by source and
      destination domain, width and relationship, and its transfer means matches
      the class: multi-stage synchroniser for single-bit asynchronous signals,
      handshake, gray code or FIFO for multi-bit asynchronous transfers, and
      timing closure rather than synchronisation for phase-related interfaces.
    requires:      [BUILD-01]
    evidence:      [the retained tool report]
    expect:        FAIL
    # DRV-PF-02 is the singleton VVP-PF-007 item because appropriateness is a
    # crossing-by-crossing review, not merely the absence of CDC tool findings.

  - id:            VC-PF-0006
    verifies:      [DRV-PF-02]
    authorised_by: VVP-PF-003
    method:        INSP
    level:         subsystem
    artifact:      verification/analysis/test_insp_build.py::test_DRV_PF_02_crossing_inventory_reviewed
    criteria: >
      The design evidence includes a reviewed inventory for every declared
      clock-domain crossing, and the inventory records the selected transfer
      means for each crossing. Missing crossings or unreviewed entries fail.
    evidence:      [JUnit result, the artefact inspected]
    execution:     witnessed
    expect:        FAIL
    # A script can enumerate candidates, but judging the transfer means against
    # the relationship between domains is witnessed until that review is encoded.

  - id:            VC-PF-0007
    verifies:      [DRV-PF-03]
    authorised_by: VVP-PF-004
    method:        ANA
    level:         subsystem
    artifact:      verification/analysis/test_ana_build.py::test_DRV_PF_03_specific_crossing_constraints
    criteria: >
      The retained CDC and timing reports show each asynchronous crossing has a
      crossing-specific constraint, and no crossing is discharged only by a
      blanket asynchronous clock-group exemption.
    requires:      [BUILD-01]
    evidence:      [the retained tool report]
    expect:        FAIL

  - id:            VC-PF-0008
    verifies:      [DRV-PF-04]
    authorised_by: VVP-PF-005
    method:        ANA
    level:         subsystem
    artifact:      verification/analysis/test_ana_clocks.py::test_DRV_PF_04_frequency_error_budget
    criteria: >
      The frequency-error budget names every FPGA clock source and sums initial
      tolerance, temperature stability and aging over mission life, using the
      worse oscillator part wherever alternate parts can populate one net.
    evidence:      [the recorded calculation]
    expect:        FAIL
    # The on-board oscillators are budgeted from their datasheets. The camera
    # lane clocks come from the sensor's oscillator, on the camera board, and
    # the PolarFire's RC oscillator needs the PolarFire datasheet.

  - id:            VC-PF-0009
    verifies:      [DRV-PF-07]
    authorised_by: VVP-PF-005
    method:        ANA
    level:         subsystem
    artifact:      verification/analysis/test_ana_clocks.py::test_DRV_PF_07_clock_derived_requirements
    criteria: >
      Every timing requirement whose bound is derived from an FPGA clock source
      cites that source's total frequency-error budget and records the remaining
      margin after applying it. An omitted clock-derived timing requirement
      fails.
    evidence:      [the recorded calculation]

  - id:            VC-PF-0010
    verifies:      [DRV-PF-05]
    authorised_by: VVP-PF-004
    method:        ANA
    level:         subsystem
    artifact:      verification/analysis/test_ana_build.py::test_DRV_PF_05_worst_case_pvt_closed
    criteria: >
      The retained static timing report identifies the operational process,
      voltage and temperature corners used for every clock domain and reports
      non-negative slack at the worst-case corner for each domain. A report that
      does not name the operational range fails.
    requires:      [BUILD-01]
    evidence:      [the retained tool report]
    expect:        FAIL

  - id:            VC-PF-0011
    verifies:      [DRV-PF-06]
    authorised_by: VVP-PF-004
    method:        ANA
    level:         subsystem
    artifact:      verification/analysis/test_ana_build.py::test_DRV_PF_06_source_sync_sta_closed
    criteria: >
      The retained timing report shows every source-synchronous or otherwise
      timing-constrained external interface has input or output delay constraints
      and closed timing, and none is treated as an asynchronous crossing in
      place of timing closure.
    requires:      [BUILD-01]
    evidence:      [the retained tool report]
    expect:        FAIL

  # -------------------------------------------------------------------------
  # CPU -- Soft processor

  - id:            VC-PF-0123
    verifies:      [PF-CPU-01]
    authorised_by: VVP-PF-003
    method:        INSP
    level:         subsystem
    artifact:      verification/analysis/test_insp_interfaces.py::test_PF_CPU_01_processor_on_tmtc_link
    criteria: >
      The SmartDesign instantiates a soft processor whose bus reaches the TMTC
      UART's registers, the UART's interrupt reaches the processor, and the
      UART's receive and transmit lines are top-level ports that the board
      connects onward. A missing processor, register path, interrupt or line
      fails.
    evidence:      [JUnit result, the artefact inspected]
    execution:     auto

  - id:            VC-PF-0124
    verifies:      [PF-CPU-02]
    authorised_by: VVP-PF-003
    method:        INSP
    level:         subsystem
    artifact:      verification/analysis/test_insp_interfaces.py::test_PF_CPU_02_processor_reaches_flash
    criteria: >
      An SPI master on the processor's APB has its clock, select and both data
      lines on top-level ports that the board connects to a single SPI flash
      device. A line that reaches no device, or a different one, fails.
    evidence:      [JUnit result, the artefact inspected]
    execution:     auto

