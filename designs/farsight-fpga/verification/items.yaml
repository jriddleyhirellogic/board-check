    criteria: >
      Every constrained signal of both DDR4 interfaces is a top-level port of
      its interface's hierarchy, is built at its constrained pin, and reaches
      on the board only DRAM devices of its own interface, every device
      receiving the same number of signals; the shield pins are grounded. A
      misplaced pin, a signal reaching anything else, or a device shared
      between the interfaces fails.
    evidence:      [JUnit result, the artefact inspected]
    execution:     auto

  - id:            VC-PF-0017
    verifies:      [PF-IO-04]
    authorised_by: VVP-PF-006
    method:        HW
    level:         bench
    artifact:      test/hw/io_bench.md::HW-PF-IO-04
    criteria: >
      On a powered board, both DDR4 interfaces are present at their assigned
      pin groups and each attached memory interface can be initialised by the
      FPGA build under test.
    evidence:      [a hardware test record]
    # PF_DDR4 is encrypted, so the boundary confidence for this item is a board
    # record rather than open simulation of the memory controller internals.

  - id:            VC-PF-0018
    verifies:      [PF-IO-05]
    authorised_by: VVP-PF-003
    method:        INSP
    level:         subsystem
    artifact:      verification/analysis/test_insp_board.py::test_PF_IO_05_ports_match_avionics_pinout
