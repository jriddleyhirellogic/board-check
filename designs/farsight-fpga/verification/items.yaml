  - id:            VC-PF-0133
    verifies:      [PF-IO-01]
    authorised_by: VVP-PF-003
    method:        INSP
    level:         subsystem
    artifact:      verification/analysis/test_insp_board.py::test_PF_IO_01_single_ended_50mhz_input
    criteria: >
      The 50 MHz reference port has a single-ended I/O standard, is built at
      its constrained pin, that pin is a clock input, and every oscillator the
      schematic places on its net is a single-output 50 MHz part. A
      differential source, another frequency or a misplaced pin fails.
    evidence:      [JUnit result, the artefact inspected]
    execution:     auto

  - id:            VC-PF-0134
    verifies:      [PF-IO-02]
    authorised_by: VVP-PF-003
    method:        INSP
    level:         subsystem
    artifact:      verification/analysis/test_insp_board.py::test_PF_IO_02_differential_148p5mhz_reference
    criteria: >
      The 148.5 MHz reference ports are built on the P and N of a transceiver
      reference pin pair, every oscillator option on the board drives its true
      output onto P and its complement onto N at 148.5 MHz, the reference buffer
      is differential, and the receivers it feeds expect 148.5 MHz. A crossed
      pair, a single-ended source or another frequency fails.
    evidence:      [JUnit result, the artefact inspected]
    execution:     auto

  - id:            VC-PF-0135
    verifies:      [PF-IO-03]
    authorised_by: VVP-PF-003
    method:        INSP
    level:         subsystem
    artifact:      verification/analysis/test_insp_board.py::test_PF_IO_03_eight_differential_camera_lanes
    criteria: >
      Each of the eight camera lanes is a P/N port pair built on a transceiver
      receive P/N pin pair, on the board net of the same lane and polarity,
      reaching one camera connector, and connected into the camera receiver.
      A swapped lane or polarity, a pair on any other pins, or a lane that
      does not reach the connector fails.
    evidence:      [JUnit result, the artefact inspected]
    execution:     auto

