    authorised_by: VVP-PF-001
    method:        SIM
    level:         unit
    artifact:      verification/tests/test_pf_xcvr.py::test_PF_XCVR_03_flag_after_disparity_run
    criteria: >
      For each lane exercised, a run of 16 consecutive disparity-error samples
      causes that lane to be flagged, and shorter non-qualifying runs do not
      flag the lane.
    requires:      [VENV-02]
    evidence:      [JUnit result, coverage contribution]
    expect:        FAIL
    # Runs of 15 never reset the receiver, but a run of 16 does only 8 times
    # in 40: its one-clock lane flag is lost crossing to the 50 MHz domain.
    # PF-F-40.
    # XCVR has no open simulation model; this targets the correction RTL
    # boundary and needs QuestaSim support if the vendor receiver is elaborated.

