  # APB -- Firmware-visible APB ICD and error semantics

  - id:            VC-PF-0012
    verifies:      [DRV-PF-01]
    authorised_by: VVP-PF-003
    method:        INSP
    level:         subsystem
    artifact:      verification/analysis/test_insp_interfaces.py::test_DRV_PF_01_apb_slots_match_icd
    criteria: >
      The APB interconnect exposes exactly the peripheral slots defined in
      CM-01979 section 25.1. A missing slot, duplicate slot, or slot at a
      different address fails.
    evidence:      [JUnit result, the artefact inspected]
    execution:     auto

  - id:            VC-PF-0013
    verifies:      [PF-APB-02]
    authorised_by: VVP-PF-001
    method:        SIM
    level:         subsystem
    artifact:      verification/tests/test_pf_apb.py::test_PF_APB_02_invalid_access_signals_error
    criteria: >
      For each APB peripheral, an invalid read or write access asserts the bus
      error indication to the master and does not return data that is
      indistinguishable from a valid read. A dummy-data response with no error
      fails.
    requires:      [VENV-02]
    evidence:      [JUnit result, coverage contribution]
    expect:        FAIL
    # Run on all twelve of the design's APB slaves and on CoreGPIO: none ever
    # raises pslverr, and none of the twelve completes a misaligned access.
    # PF-F-10, PF-F-42.

