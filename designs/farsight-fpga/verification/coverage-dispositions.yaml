# ---- outside-flight

- file: frame_xfer_ctrl.sv
  lines: 328-348
  at: "if(h_size_beat_eff > MAX_BURST_SIZE) begin"
  kind: outside-flight
  reason: >
    Splits a line into several 256-beat AXI bursts. The flight line is 6784
    bytes (farsight-avionics-sw Camera/include/camera.h:129, HORIZ_WIDTH_BYTE),
    212 beats on the 8 GB bank and 106 on the 16 GB bank, so one burst always
    holds a line.
- file: frame_xfer_ctrl.sv
  lines: 420-422
  at: "if(beat_counter < h_size_beat_eff) begin"
  kind: outside-flight
  reason: The next burst of a split line; flight lines are never split (above).
- file: dma_write_send_ctrl.sv
  lines: 242-245
  at: "if ((total_beat + MAX_BURST_SIZE) <= max_chunk_count) begin"
  kind: outside-flight
  reason: >
    Splits a line's write into several 256-beat bursts. A 6784-byte flight
    line is 106 chunks of 512 bits, so max_chunk_count is 212 on the 8 GB bank
    (DIN_DOUT_RATIO 2) and 106 on the 16 GB bank, never above 256.
- file: dma_write_send_ctrl.sv
  lines: 342-343
  at: "arb_write_start_addr <= arb_write_start_addr +"
  kind: outside-flight
  reason: The next burst of a split write; flight lines are never split (above).
