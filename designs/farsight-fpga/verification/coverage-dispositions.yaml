# Code no test executed that is not a gap in the tests, and why.
#
# Read by `make code-coverage` (fsverif.codecov.dispositions). Each entry names
# a file as the coverage report does, a line range, the text expected on its
# first line, one of the kinds below, and the reason. An entry is not applied,
# and the report says so, if its first line no longer reads `at` (the source
# moved) or if any line in it was executed (the reason is wrong, or no longer
# needed). Anything never executed and not listed here is a gap: behaviour to
# test, or a requirement to ask for.
#
# Kinds:
#   illegal-state   recovery from a state encoding the FSM never assigns;
#                   reachable only by an upset of its state register
#   outside-flight  reachable only with a parameter or register value the
#                   flight configuration does not use
#   unreachable     no input reaches it

# ---- illegal-state: a default arm for encodings the FSM never assigns

