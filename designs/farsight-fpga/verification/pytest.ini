[pytest]
testpaths = tests analysis
python_files = test_*.py
python_functions = test_*

# Every simulation module is an independent Verilator build and an independent
# process, so they run at the same time, and the suite costs its slowest
# module rather than the sum.
#
# `loadfile` rather than the default, which distributes by test *function*. The
# pytest function in a simulation module is one item that launches a whole
# cocotb run, so the default leaves those items on whichever worker takes them
# and schedules the cheap unit tests around them; by file, each simulation
# module gets a worker of its own.
#
# For debugging, turn it off: parallel workers capture output, so `-s` does
# nothing under xdist.
#
#     pytest -n0 -s tests/test_pf_pps.py
addopts = -v -n auto --dist loadfile
