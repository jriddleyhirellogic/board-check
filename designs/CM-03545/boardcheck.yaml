# Board check configuration for CM-03545 FARSIGHT flight model.
# Values here override boardcheck/config.py DEFAULTS; see that file for
# every option.

export:
  min_version: "2.2.1"
  # Title and hierarchy sheets: no components by design.
  empty_sheets_ok:
    - CM-03543.SchDoc
    - FARSIGHT TOP LEVEL.SchDoc
    - PROASIC3 TOP LEVEL.SchDoc
  # From the ExportAllSchematicsToJSON v2.2 notes: what a complete export
  # of CM-03545 looks like. Update when the design changes.
  expect:
    sheets: 37
    part_numbers: 254
    designators:
      U1: {parts: 14, pins: 1152}
      U2: {parts: 10, pins: 484}
      U5: {parts: 2}
      U6: {parts: 2}
      U7: {parts: 2}
      U8: {parts: 2}
      U9: {parts: 2}
      U10: {parts: 2}
      U11: {parts: 2}
      U12: {parts: 2}
      U13: {parts: 2}

# S1..S8 are screws and standoffs (McMaster, Omnetics jackscrews), not switches.
designator_kinds:
  S: mechanical

derating:
  capacitor_voltage: {ceramic: 0.60, tantalum: 0.50, default: 0.60}
  resistor_power: 0.50

# Accepted findings. Each needs a reason; a waiver that stops matching is
# reported (CFG001) so stale ones get cleaned up. Match on check plus any
# of ref / net / part_number (glob patterns) or match (message substring).
waivers: []
#  - check: PWR005
#    ref: U2
#    reason: unused ProASIC3 PLL supplies VCCPLx tied to GND per datasheet

# FPGA I/O configuration, read from the FPGA projects' own files where they
# live: designs/farsight-fpga and designs/farsight-fpga-house-keeper (the
# housekeeper uses the io/fm pinout: CM-03545 is the flight model).
# constraints give pin assignment, I/O standard, pull, drive and bank
# voltages; top_level gives each port's direction as the design declares it.
# These are the files the bitstreams are built from, so the checks always
# see the current configuration.
fpga:
  U1:   # PolarFire MPF500TS-FC1152M
    constraints:
      - ../farsight-fpga/constr/mpf500ts-fc1152m/io/io_constraints.pdc
    top_level:
      - ../farsight-fpga/bd/mpf500ts-fc1152m/top/components/top.tcl
    timing:       # create_clock periods on ports (CLK005/CLK006)
      - ../farsight-fpga/constr/mpf500ts-fc1152m/sdc/timing_user_constraints.sdc
    bank_pattern: '(?:GPIO|HSIO)\d+[PN]B(\d+)'   # HSIO162PB0 -> bank 0, GPIO261PB4 -> bank 4
    bank_supply: 'VDDI{bank}'
    bank_name: 'Bank{bank}'
    bank_type_pattern: '^(GPIO|HSIO)'         # I/O bank type for the part data
    pair_patterns:                            # differential pairs: HSIO162PB0 / HSIO162NB0, XCVR_4_RX3_P / _N
      - '^(?:GPIO|HSIO)(?P<pair>\d+)(?P<pol>[PN])B\d+'
      - '^(?P<pair>XCVR_\w+?)_(?P<pol>[PN])$'
    transceiver_pattern: '^XCVR_(?P<quad>\d+)[A-Z]?_(?P<role>RX|TX|REFCLK)'
    # Unconstrained user I/O, from the retained build's pin report as quoted in
    # farsight-fpga docs/requirements/pf-fpga-findings.md PF-F-50 (:521).
    unused_io: 'the build leaves it tristated with a weak pull-up (input buffer disabled)'
    unused_pull: up
  U2:   # ProASIC3L A3PE3000L-FG484M (housekeeper)
    constraints:
      - ../farsight-fpga-house-keeper/constr/a3pe3000l-fg484m/io/fm/io_constraints.pdc
    top_level:
      - ../farsight-fpga-house-keeper/src/top.sv
    timing:
      - ../farsight-fpga-house-keeper/constr/a3pe3000l-fg484m/sdc/timing_user_constraints.sdc
    top_module: top
    bank_pattern: 'IO\d+[PN][A-Z]B(\d+)V\d'   # IO40PDB0V4 -> bank 0
    bank_supply: 'VCCIB{bank}'
    pair_patterns:                            # IO40PDB0V4 / IO40NDB0V4
      - 'IO(?P<pair>\d+)(?P<pol>[PN])[A-Z]B\d+V\d'

# Firmware read in place from designs/farsight-avionics-sw, like the FPGA files.
firmware:
  adc_channel_maps:
    - name: power telemetry
      # Camera/src/tlm_adc.c: input = index & 7, chip select = index >> 3
      enum_file: ../farsight-avionics-sw/Camera/include/tlm_adc.h
      enum: TLM_Signal_t
      skip: [NUMBER_TLM_SENSORS]
      strip_prefix: TLM_
      channels_per_select: 8
      fpga: U1
      select_link: 'temp_tlm_spi_inst:SPISS\[{n}:{n}\]'
      adc_select_pin: CS
      adc_input_pin: 'IN{ch}'
      net_strip: ['_ADC$', '_TLM$']
      adc_reference_pin: VA
      adc_bits: 12
      # Per-channel scale factors (V or A per count) in a comment table that
      # no firmware source includes; the intended values (FW014).
      scale_table:
        file: ../farsight-avionics-sw/Camera/include/telemetry.h
      calibration:
        file: ../farsight-avionics-sw/Cal_spreadsheets/default_cals.xlsx
        sheet: TLM
        columns: [Signal, Gain, Offset]
  pwm_outputs:
    - name: stepper VREF
      # Camera/src/hal/hal_pwm.c: VREF = PWM_VREF_mV * duty, I_FS = VREF / K_V
      constant_file: ../farsight-avionics-sw/Camera/include/pwm.h
      constant: PWM_VREF_mV
      constant_unit: mV
      fpga: U1
      ports: [pri_stp_motor_vref_pwm, sec_stp_motor_vref_pwm]
      # DRV8434: I_FS = VREF / KV (SLOSE47A 7.3.5)
      limit: {constant: I_MAX_MA, unit: mA, gain: kv, result_unit: A}
  gpio_maps:
    - name: camera GPIO
      # Camera/include/gpio_pin_def.h: each comment starts a group of bits of
      # one CoreGPIO (GPIO_init base address in camera.c / hw_init.c, defined
      # in Camera/include/mem_map.h, not fpga_design_config.h's Mi-V template
      # addresses). Instance names: the APB slave at that address in the
      # FPGA's SmartDesign.
      header: ../farsight-avionics-sw/Camera/include/gpio_pin_def.h
      source_dir: ../farsight-avionics-sw/Camera/src
      fpga: U1
      blocks:
        - {groups: [Cam ctrl], instance: cam_rx_inst/gpo_cam_ctrl_inst, pin: GPIO_OUT}                 # GPO_CAM
        - {groups: [Eth PCIe sel], instance: eth_pcie_mux_hier_inst/eth_pcie_sel_coregpio_inst, pin: GPIO_OUT}
        - {groups: [Async DDR4 rst], instance: rst_hier_inst/rst_ddr4_hier_16gb_inst/async_rst_ddr4_coregpio_inst, pin: GPIO_OUT}
        - {groups: [Eth1 ctrl], instance: eth1_hier_inst/gpo_eth1_ctrl, pin: GPIO_OUT}                 # ETH1_CTRL
        - {groups: [Eth1 status], instance: eth1_hier_inst/gpi_eth1_stat_inst, pin: GPIO_IN}           # ETH1_STAT
        - {groups: [PWR Enable], instance: hk_hier_inst/gpo_hk_pwr_ctrl_inst, pin: GPIO_OUT}           # GPO_HK_PWR
        - {groups: [PWR Status, The power status bits], instance: hk_hier_inst/gpi_hk_status_inst, pin: GPIO_IN}  # GPI_HK_STATUS
