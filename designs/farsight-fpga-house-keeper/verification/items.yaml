    evidence:      [JUnit result, the artefact inspected]
    execution:     auto
    expect:        FAIL

  - id:            VC-HK-0014
    verifies:      [HK-IMPL-10]
    authorised_by: VVP-HK-004
    method:        SIM
    level:         subsystem
    artifact:      test/sim/upset_tb::test_HK_IMPL_10_tolerant_beyond_first_upset
    criteria: >
      After an injected upset in one leg of a triplicated group is
      corrected, a further upset injected into a different leg of the
      same group is also corrected and the voted output stays correct. A
      design that survives the first upset and diverges on the second
      fails. At least one injection is performed into every triplicated
      group.
    evidence:      [JUnit result, coverage contribution]
    expect:        FAIL
    # Not writable in the RTL simulation this suite runs. TMR is inserted by
    # Synplify at synthesis (syn_radhardlevel="tmr"); the RTL has no
    # triplicated groups to inject into, and nothing in it says what the
    # synthesiser emits -- which is the question. This needs a gate-level
    # simulation of the synthesised TMR netlist against the ProASIC3
    # primitive library: a Synplify licence to produce the netlist, and a
    # simulator decision (framework II.4) that no plan has made.

  - id:            VC-HK-0015
    verifies:      [HK-IMPL-20]
    authorised_by: VVP-HK-002
    method:        ANA
    level:         subsystem
    artifact:      test/analysis/build.py::test_HK_IMPL_20_utilisation_margin
    criteria: >
      For each resource class r of the device -- core cells, RAM blocks,
      I/O, global clock networks -- CBE_r = (U_r / A_r) x 100% is no more
      than 80%, where U_r is the use of class r reported by Libero after
      place-and-route of the latest flight-configuration build (TMR
      enabled, flight pinout) and A_r is what the A3PE3000L-FG484
      provides. A report that does not state a class counts as that
      class failing, not as zero.
    evidence:      [the retained tool report]
    # Pending systems confirmation: 80% CBE at CDR is the margin policy
    # proposed on 2026-09-29. Previously BLOCKED on a TBR bound.

