    authorised_by: VVP-HK-004
    method:        SIM
    level:         subsystem
    artifact:      verification/tests/test_hk_io_filter.py::test_HK_IO_05_pgood_nfault_5us_filter
    criteria: >
      For every PGOOD, nFAULT and EPS eFuse PGOOD input: a pulse of 4.74
      us -- just below the 5 us +/-5 % band -- does not propagate; a level
      held for 5.26 us -- just above it -- does. Both edge directions are
      exercised on every such input, and every input has the same
      pin-to-filter latency.
    # The band was proposed on 2026-09-29 for the TBR in FAR-PM_FPGA_L4REQ-4,
    # -5, -14 and -17, and confirmed on 2026-10-01 (avionics hardware).
    requires:      [VENV-01, VENV-02]
    evidence:      [JUnit result, coverage contribution]
    # Reaches inside the design: the test reads glitch_filter.d_out, made
    # addressable for that module alone. Two of the six directions have no
    # consequence at the pins -- latchup is on a low nFAULT, and the eFuse
    # sets a power-down that nothing clears -- so "both directions on every
    # input" cannot be shown there. The filter output shows every one.

