  - id:            VC-HK-0012
    verifies:      [HK-IMPL-04]
    authorised_by: VVP-HK-001
    method:        INSP
    level:         subsystem
    artifact:      test/inspect/build.py::test_HK_IMPL_04_no_test_logic_in_flight
    criteria: >
      The flight build sets no parameter value and no define of its own
      beyond the variant's TMR switch, and its source set, at the commit
      it records, tests no other conditional-compilation symbol and
      contains no synthesis-excluded test hook. Parameters set inside the
      RTL are design, reviewed with it; what is checked is what the build
      changes. The comparison is against the delivered build, not the
      working tree.
    evidence:      [JUnit result, the artefact inspected]
    execution:     auto

  - id:            VC-HK-0013
    verifies:      [HK-IMPL-18]
    authorised_by: VVP-HK-001
    method:        INSP
    level:         subsystem
    artifact:      test/inspect/build.py::test_HK_IMPL_18_variant_identifier_in_file
    criteria: >
      The programming file carries a variant identifier readable from
      its contents alone -- its silicon signature (USERCODE), which a
      programmed device also reports -- and that identifier equals the
      one recorded in the build manifest. Renaming the file or moving it
