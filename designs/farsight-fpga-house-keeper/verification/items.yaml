  - id:            VC-HK-0032
    verifies:      [HK-SRC-01]
    authorised_by: VVP-HK-004
    method:        SIM
    level:         subsystem
    artifact:      test/sim/source_tb::test_HK_SRC_01_individually_controllable
    criteria: >
      Every power source has an enable output of its own, which changes
      only for that source's own boot, power-down or failure. In each
      software-controlled region, a boot failure and a latchup of each
