# Verification items for the housekeeper FPGA.
#
# An item binds one or more requirements to a specific piece of evidence and
# cites the plan clause that authorises the method. Schema: framework I.6.
# Clauses: docs/plans/hk-fpga-vv-plan.md in farsight-verification.
#
# ---------------------------------------------------------------------------
# NO VERIFICATION SIMULATION EXISTS YET.
#
# Every `artifact` below names a test that has still to be written. That is
# the intended order, not a shortfall: an item states what would constitute a
# pass, so writing it first makes the item the specification the test must
# satisfy. Writing the criterion down is also what exposes a weak one, which
# is how the two-build TMR criterion was found to be unworkable before anyone
# implemented it.
#
# The framework already describes this state correctly and needs nothing added
# for it (III.1). An item that exists and has never run is *no evidence*: D1
# counts the requirement as traced, D3 records that nothing has executed, and
# the two are reported separately so neither hides the other.
#
# The simulations currently in `test/sim/` are development material and are
# not cited here. A script no item cites is engineering material, not
# evidence (framework VII.6).
#
# ---------------------------------------------------------------------------
# Identifiers are flat and opaque, allocated in creation order, and never
# embed a requirement identifier -- an item that later covers a second
# requirement would otherwise be lying about itself (framework I.2, Rule 1).
#
# `artifact` paths assume the testbench lives under `test/sim/`. The file
# extension and harness follow the verification environment's implementation
# choice, which is deliberately not made by a plan (VEP). The *test name* is
# stable either way, because VVP-HK-004 derives it from the requirement.

items:

  - id:            VC-HK-0001
    verifies:      [HK-LAT-01]
    authorised_by: VVP-HK-004
    method:        SIM
    level:         subsystem
    artifact:      verification/tests/test_hk_lat_01.py::test_HK_LAT_01_pgood_low_after_boot
    criteria: >
      With a hardware-controlled source booted successfully, driving its
      filtered PGOOD low declares a latchup for that source within one
      filtered sample.
    requires:      [VENV-01, VENV-02]
    evidence:      [JUnit result, coverage contribution]

  - id:            VC-HK-0002
    verifies:      [HK-LAT-01]
    authorised_by: VVP-HK-004
    method:        SIM
    level:         subsystem
    artifact:      verification/tests/test_hk_lat_01.py::test_HK_LAT_01_nfault_low_while_enabled
    criteria: >
      With a hardware-controlled source enabled, driving its filtered nFAULT
      low declares a latchup for that source within one filtered sample.
    requires:      [VENV-01, VENV-02]
    evidence:      [JUnit result, coverage contribution]
    # Two items for one requirement, because the requirement has two
    # independent trigger conditions joined by "or". A single test exercising
    # only PGOOD would pass while the nFAULT path was never entered, and
    # nothing in a pass/fail result would say so. Writing the criteria is what
    # made the second path visible.

  - id:            VC-HK-0003
    verifies:      [HK-LAT-02]
    authorised_by: VVP-HK-004
    method:        SIM
    level:         subsystem
    artifact:      verification/tests/test_hk_lat_global.py::test_HK_LAT_02_global_latch_from_every_hw_region
    criteria: >
      For every hardware-controlled region in turn, a declared latchup in that
      region asserts the global critical latchup condition. The test iterates
      the region list rather than sampling it.
    requires:      [VENV-01, VENV-02]
    evidence:      [JUnit result, coverage contribution]
    # level: subsystem is load-bearing here. The requirement says "any
    # hardware-controlled region", so evidence from one source state machine
    # would satisfy D1 while the propagation path to the global latch stayed
    # untested -- the exact limitation framework III.2 describes and reports
    # rather than gates. VVP-HK-004 carries no Level, so IV.6 check 6 does not
    # enforce this; it is a judgement recorded in the item.

  - id:            VC-HK-0004
    verifies:      [HK-LAT-03]
    authorised_by: VVP-HK-004
    method:        SIM
    level:         subsystem
    artifact:      verification/tests/test_hk_lat_hold.py::test_HK_LAT_03_all_enables_held_deasserted
    criteria: >
      While the global critical latchup condition is asserted, every power
      enable output of the design is deasserted, and remains deasserted for
      the duration of the condition. The check enumerates the enable outputs
      of the synthesised top level rather than a list maintained in the test.
    requires:      [VENV-01, VENV-02]
    evidence:      [JUnit result, coverage contribution]
    # "every power enable in the system" is the whole claim. A test carrying
    # its own hand-written list of enables silently stops covering one that is
    # added later, and still passes -- the same failure shape as a plan that
    # lists requirements instead of selecting them (framework I.2, Rule 2).

  - id:            VC-HK-0005
    verifies:      [HK-LAT-04]
    authorised_by: VVP-HK-004
    method:        SIM
    level:         subsystem
    artifact:      verification/tests/test_hk_lat_hold.py::test_HK_LAT_04_recovery_requires_external_reset
    criteria: >
      With the global critical latchup condition asserted, the condition
      remains asserted across the stimulus set the test applies -- including
      removal of the originating fault, software commands to the affected
      regions, and re-assertion of the source enables -- and clears only on
      assertion of the external reset input.
    requires:      [VENV-01, VENV-02]
    evidence:      [JUnit result, coverage contribution]
    # The requirement is a universal negative: recovery shall require external
    # reset. No simulation establishes that no other input sequence clears the
    # latch; it establishes that the sequences tried did not. The criterion
    # says which were tried, so the strength of the evidence is legible rather
    # than assumed. Widening it is a test change, not a requirement change.
    #
    # "Re-assertion of the source enables" is not applied: the enables are
    # outputs, and nothing on a board drives them. The test substitutes the
    # nearest input -- the fault removed, so every rail would come good if
    # enabled -- and adds the 1 s start-up interval elapsing, because that
    # counter is not held by the latch and is what started the chain once.

  - id:            VC-HK-0006
    verifies:      [HK-LAT-05]
    authorised_by: VVP-HK-004
    method:        SIM
    level:         subsystem
    artifact:      verification/tests/test_hk_lat_sw_region.py::test_HK_LAT_05_sw_region_isolated
    criteria: >
      A declared latchup in a software-controlled region deasserts that
      region's power enables, and the enables of every other region are
      unchanged across the event.
    requires:      [VENV-01, VENV-02]
    evidence:      [JUnit result, coverage contribution]
    # "only that region" is the load-bearing word, and it is the half a test
    # most easily omits: checking that the affected region powers down is
    # obvious, checking that nothing else moved is the actual requirement.

  - id:            VC-HK-0007
    verifies:      [HK-LAT-07]
    authorised_by: VVP-HK-004
    method:        SIM
    level:         subsystem
    artifact:      verification/tests/test_hk_uart_beacon.py::test_HK_LAT_07_first_failure_snapshot_retained
    criteria: >
      After a first failure, the retained PGOOD and nFAULT state of every
      hardware-controlled source equals the state sampled at the instant of
      that failure, and a subsequent failure on another source does not
      overwrite it.
    requires:      [VENV-01, VENV-02]
    evidence:      [JUnit result, coverage contribution]
    # "the first failure" is what the second clause of the criterion tests. A
    # snapshot that is correct for one failure and overwritten by the next
    # satisfies a naive reading and loses the diagnostic the requirement
    # exists to preserve.

  - id:            VC-HK-0008
    verifies:      [HK-LAT-08]
    authorised_by: VVP-HK-004
    method:        SIM
    level:         subsystem
    artifact:      verification/tests/test_hk_response.py::test_HK_LAT_08_deassert_within_bound
    criteria: >
      A latchup in a software-controlled region (IMX, its 1V8 rail
      dropped after boot) and one in a hardware-controlled region (DDR16,
      its 1V2 nFAULT asserted) each deassert every affected enable that
      was asserted within 10 us of the fault first appearing at the input
      pin. The 5 us input filter is inside the 10 us.
    requires:      [VENV-01, VENV-02]
    evidence:      [JUnit result, coverage contribution]
    # 10 us proposed on 2026-09-29 for "immediately" in FAR-PM_FPGA_L4REQ-12,
    # -14 and -17; confirmed for -14 on 2026-10-01 (avionics hardware), -12
    # and -17 still pending. Previously BLOCKED on a TBR bound.

# ---------------------------------------------------------------------------
# Not yet written for this area:
#
#   HK-LAT-06   withdrawn; identifier retained (framework I.4). No item, and
#               its absence from the sequence above is correct rather than an
#               omission.
#
# There are no coverage items here, and there should not be. Coverage over the
# housekeeper RTL is an obligation on the verification environment -- VENV-03
# and VENV-04, governed by the verification environment plan -- and resolving
# what it finds is closure condition D5, reported per configuration. It was
# previously written as VVP-HK-008, a `shall` inside a V&V plan, which is a
# requirement on the environment stated in a design's plan (framework IV).

  # =========================================================================
  # The remaining housekeeper requirements, written as specifications.
  #
  # Method follows the requirement's own `Verify:` field. Where a requirement
  # names more than one, the item takes the method that produces the primary
  # evidence and the clause that authorises it; a second item can be added
  # later for the confirming method without changing this one.
  #
  # `criteria: BLOCKED` appears where the requirement carries an open TBR
  # bound. That is not an omission: the requirement does not yet say what
  # would pass, so no criterion can be written, and D6 names the bound and
  # its owner. D1 does not count these as traced.
  #
  # `expect: FAIL` appears wherever the requirement's status is GAP, DEFECT
  # or AMBIG. The shortfall is already known; the item exists to measure it,
  # and without the field a failing test invites somebody to fix the test.
  # =========================================================================

