  - id:            VC-HK-0011
    verifies:      [HK-IMPL-03]
    authorised_by: VVP-HK-001
    method:        INSP
    level:         subsystem
    artifact:      test/inspect/build.py::test_HK_IMPL_03_safe_state_encoding
    criteria: >
      The retained synthesis report lists every extracted state machine,
      and each carries safe encoding with a defined transition out of
      illegal states. A state machine present in the source but absent
