  - id:            VC-HK-0115
    verifies:      [DRV-HK-03]
    authorised_by: VVP-HK-004
    method:        SIM
    level:         subsystem
    artifact:      test/sim/gatelevel_tb::test_DRV_HK_03_release_on_one_edge
    criteria: >
      In a simulation back-annotated with the routed delays, reset released
      at several phases within a clock period leaves every sequential
      element's reset on the same rising clock edge.
    requires:      [VENV-02]
    evidence:      [JUnit result]
    expect:        FAIL
    # Not writable in RTL simulation, and deliberately not written there. In
    # RTL rstn is one net with no delay, so every element leaves reset on the
    # same edge by construction and a test could not fail. What DRV-HK-03
    # guards against is routing skew on a net of near-total fanout, which
    # exists only after place and route. HK-CLK-04 shows the RTL half: the
    # release acts on a clock edge whatever its phase. This needs a
    # gate-level simulation with SDF -- the same environment gap as
    # VC-HK-0014, and a decision no plan has made (framework II.4).

