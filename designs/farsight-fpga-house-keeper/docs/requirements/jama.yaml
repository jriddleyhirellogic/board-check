# Jama requirements that fall on the PA3 housekeeper. Generated by
# `python -m fsverif.jama --csv <export>`; edit `note:` by hand, not the text.
#
# Every FAR-PM_FPGA L4 requirement, every other Jama requirement a
# housekeeper requirement cites as its parent, and any listed with a `note:`
# saying why it is here with nothing under it.
source: Jama trace view "Farsight", CSV export Farsight.csv of 2026-09-25
requirements:
  - id: FAR-PM_FPGA_L4REQ-3
    name: Protect PolarFire On Bootup
    text: >
      The housekeeper FPGA shall only drive signals high to the PolarFire FPGA
      while the PolarFire is booted
  - id: FAR-PM_FPGA_L4REQ-4
    name: Powering Down
    text: >
      The housekeeper FPGA shall consider a power down of a power source
      complete when its pgood signal has been low for at least (TBR) 5us
  - id: FAR-PM_FPGA_L4REQ-5
    name: Efuse Shutdown
    text: >
      The proasic3 housekeeper FPGA shall initiate a controlled shutdown if
      the 28V0_EPS efuse PGOOD signal goes low for (TBR) 5us
  - id: FAR-PM_FPGA_L4REQ-6
    name: IMX Shorting
    text: >
      The housekeeper FPGA shall implement two output pins to short the IMX
      1V1 and 1V8 power sources in the event of a PGOOD or nFAULT going low
      with respective supplies.
  - id: FAR-PM_FPGA_L4REQ-8
    name: Booting Power Sources
    text: >
      The housekeeper FPGA shall attempt to boot all the power sources one by
      one according to the boot order specified in table 1 (See pa3_reqs
      excel)
  - id: FAR-PM_FPGA_L4REQ-9
    name: Power Source FDIR
    text: >
      The housekeeper FPGA shall attempt to boot a power source by setting a
      power enable high and monitoring the source's pgood and nfault outputs
  - id: FAR-PM_FPGA_L4REQ-10
    name: Failed Boot Response
    text: >
      The housekeeper FPGA shall boot down all currently booted power sources
      in reverse order if a critical power region fails to boot and remain in
      a powered off state until power cycle
  - id: FAR-PM_FPGA_L4REQ-11
    name: Boot Attempt Failure Detection
    text: >
      The housekeeper FPGA shall consider a boot attempt of a power source a
      fail if it does not boot within 200% of its nominal boot time
  - id: FAR-PM_FPGA_L4REQ-12
    name: SW-Controlled Power Source FDIR
    text: >
      The housekeeper FPGA shall immediately turn off all power enable signals
      in the power region until the PolarFire SW enable is cycled off and on
      again if a latchup events occurs in a SW-controlled power region
  - id: FAR-PM_FPGA_L4REQ-14
    name: Latchup FDIR
    text: >
      The housekeeper FPGA shall immediately turn off all power enable signals
      until power cycle if an nfault signal going to a non-SW controlled power
      region goes low for at least (TBR) 5us on any power source that is
      currently enabled and/or booted
  - id: FAR-PM_FPGA_L4REQ-15
    name: Notification of Fault
    text: >
      The housekeeper FPGA shall broadcast an error message over UART every
      (TBR) second to the bus indicating that a latchup event occurred in a
      non-SW controlled power region until power cycle
  - id: FAR-PM_FPGA_L4REQ-16
    name: Broadcast Message
    text: >
      The housekeeper FPGA shall report pgood and nfault status for all HW
      controlled power regions to the bus over UART as specified in table 2
      every second if a latchup occurs in a HW controlled power region
  - id: FAR-PM_FPGA_L4REQ-17
    name: Latchup timing Detection
    text: >
      The housekeeper FPGA shall immediately turn off all power regions until
      power cycle if a pgood signal going to a successfully booted power
      source in a HW controlled power region goes low for ≥ 5 us
  - id: FAR-PM_FPGA_L4REQ-18
    name: Failed Boot Timing
    text: >
      The housekeeper FPGA shall immediately set all power enable signals in
      the power region low for at least 200ms after any power source in the
      power region fails to boot and restart the boot process for that power
      region
  - id: FAR-PM_FPGA_L4REQ-19
    name: Maximum Boot Attempts
    text: >
      The housekeeper FPGA shall attempt to boot a power region ≤ 4 times
  - id: FAR-PM_FPGA_L4REQ-20
    name: Boot Attempt Success Detection
    text: >
      The proasic3 housekeeper FPGA shall consider a boot attempt of a power
      source a success if the pgood signal rises and remains stable for 5us
      while the respective enable is logic high.
  - id: FAR-PM_FPGA_L4REQ-21
    name: Enable SW Controlled Sources
    text: >
      The housekeeper FPGA shall enable SW controlled sources on request from
      the PolarFire FPGA
  - id: FAR-PM_FPGA_L4REQ-22
    name: Enable Communication Interfaces
    text: >
      The housekeeper FPGA shall enable the communication interfaces upon
      request from the PolarFire FPGA
  - id: FAR-PM_FPGA_L4REQ-23
    name: LVDT Enable
    text: >
      The housekeeper FPGA shall enable the LVDT upon request from the
      PolarFire FPGA
  - id: FAR-PM_FPGA_L4REQ-24
    name: Prevent Simultaneous Primary and Secondary Stepper Motor Power
    text: >
      The housekeeper FPGA shall never have the primary stepper motor and the
      secondary stepper motor enabled at the same time
  - id: FAR-PM_FPGA_L4REQ-25
    name: Enable Stepper Motor
    text: >
      The housekeeper FPGA shall enable either the primary stepper motor or
      the secondary stepper motor upon request from the PolarFire FPGA
  - id: FAR-PM_FPGA_L4REQ-26
    name: Enable IMX Sensor
    text: >
      The housekeeper FPGA shall enable the IMX sensor upon request from the
      PolarFire FPGA
  - id: FAR-PM_FPGA_L4REQ-27
    name: Enable Non-SW Controlled Sources
    text: >
      The housekeeper FPGA shall boot all power regions that are not SW
      controlled during initial boot sequence
  - id: FAR-PM_FPGA_L4REQ-28
    name: Component Enabled Notification
    text: >
      The housekeeper FPGA shall report power rail status for each power
      region to the PolarFire FPGA
  - id: FAR-PM_FPGA_L4REQ-29
    name: Report Power Rail Failure
    text: >
      The housekeeper FPGA shall report power rail failure(s) to the PolarFire
      FPGA in the event that any of the power rails fail to boot
  - id: FAR-PM_FPGA_L4REQ-30
    name: Report SW-controlled Failure
    text: >
      The housekeeper FPGA shall report which power source failed inside a
      SW-controlled power region to the PolarFire FPGA
  - id: FAR-PM_FPGA_L4REQ-31
    name: Power Management RS422 Debug Interface
    text: >
      Avionics EPS shall provide status information to the user via the RS422
      debug line if the PolarFire is power-off or not functioning
  - id: FAR-PM_FPGA_L4REQ-32
    name: Forward RS422 Messages
    text: >
      The housekeeper FPGA shall forward all UART communication from the bus
      to the PolarFire FPGA in the case that the PolarFire FPGA is currently
      booted
  - id: FAR-PM_FPGA_L4REQ-33
    name: Power Management Firmware Version
    text: >
      The housekeeper FPGA shall report a FW version number to PolarFire FPGA
  - id: FAR-AB_L2REQ-1
    name: FPA Temperature Over-Temperature Protection
    text: >
      The board shall power off the FPA in the event that operating
      temperatures are exceeded
    note: >
      Not allocated to the housekeeper in Jama, but the housekeeper is the
      only agent that can remove FPA power, and it has no temperature input.
      No housekeeper requirement answers it; see HK-F-13.
  - id: FAR-AB_L2REQ-9
    name: Avionics Reset
    text: >
      FARSIGHT Avionics shall safely reset upon user request
  - id: FAR-AEPS_L3REQ-10
    name: FPGA for Power Management
    text: >
      The PolarFire shall use a housekeeper FPGA to manage power sequencing of
      subcomponents, compliant with PA3 Requirements (See PA3 Requirements in
      FARSIGHT Sharepoint)
  - id: FAR-EDT_L3REQ-13
    name: Redundant Ethernet
    text: >
      FARSIGHT Avionics shall have redundant ethernet interfaces
  - id: FAR-TMTC_SW_L4REQ-18
    name: Knowledge of Enabled Components
    text: >
      The TMTC system shall have knowledge of which components are enabled or
      disabled
