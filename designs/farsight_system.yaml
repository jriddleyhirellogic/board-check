# Farsight boards and the connectors that join them. Run with
#   python -m boardcheck system designs/farsight_system.yaml
# Paths are relative to this file.

boards:
  CM-03545: {export: CM-03545/CM-03545.json, config: CM-03545/boardcheck.yaml}
  CM-03986: {export: CM-03986/CM-03986.json, config: CM-03986/boardcheck.yaml}
  CM-02441: {export: CM-02441/CM-02441.json, config: CM-02441/boardcheck.yaml}

links:
  - name: sensor (J7-J1)
    a: CM-03545:J7
    b: CM-02441:J1
    map: pins                       # Omnetics A49256/A49255 mated directly, pin n to pin n

  - name: ethernet (J3-J2)
    a: CM-03545:J3
    b: CM-03986:J2
    map:                            # harness, wired by name: MDI pair n to backplane ETH5 TX pair n
      by: name
      a: 'ETH1_MX(\d)_([PN])$'
      b: 'Q8J_ETH5_TX(\d)_([PN])$'
    unpaired_ok: ['^Q8J_ETH5_LED']  # the RJ45 status LEDs are not carried to Farsight

  - name: control (J1-J3)
    a: CM-03545:J1
    b: CM-03986:J3
    map:                            # harness, wired by name; P/N carried across
      by: name
      suffix: '_([PN])$'
      names:
        RS422_BUS_TO_FARSIGHT: RS422_BP_TO_FARSIGHT
        RS422_FARSIGHT_TO_BUS: RS422_FARSIGHT_TO_BP
        PPS: PPS_RMT_TO_FARSIGHT
        GPOUT: GPO_FARSIGHT_TO_BP
        GPIN: GPI_BP_TO_FARSIGHT
        TRIG: TRIG_BP_TO_FARSIGHT
        INTERRUPT: INTERRUPT_FARSIGHT_TO_BP
        PR_SS: PR_SS_BP_TO_FARSIGHT
        PR_SDI: PR_SDI_BP_TO_FARSIGHT
        PR_SDO: PR_SDO_FARSIGHT_TO_BP
        PR_SCK: PR_SCK_BP_TO_FARSIGHT

  - name: PCIe (J2-J4)
    a: CM-03545:J2
    b: CM-03986:J4
    map:                            # Samtec ARF6 cable, wired by name
      by: name
      suffix: '_([PN])$'
      names:
        PCIE_REF_CLK: REFCLK_FARSIGHT
        PCIE0_TX: PCIE_FARSIGHT_TO_BP_0
        PCIE1_TX: PCIE_FARSIGHT_TO_BP_1
        PCIE0_RX: PCIE_BP_TO_FARSIGHT_0
        PCIE1_RX: PCIE_BP_TO_FARSIGHT_1
        PCIE_nRESET: PCIE_nRESET_BP_TO_FARSIGHT
        UNUSED0: UNUSED0
        UNUSED1: UNUSED1
